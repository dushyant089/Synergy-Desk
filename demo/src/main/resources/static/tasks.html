<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Synergy Desk - Tasks</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="brand">
            <h2>Synergy Desk</h2>
            <span>Employee Management</span>
        </div>

        <nav class="sidebar-nav">

            <a href="dashboard.html" class="nav-item">
                <span>📊</span>
                Dashboard
            </a>

            <a href="employees.html" class="nav-item">
                <span>👥</span>
                Employees
            </a>

            <a href="tasks.html" class="nav-item active">
                <span>📋</span>
                Tasks
            </a>

            <a href="#" class="nav-item">
                <span>📅</span>
                Attendance
            </a>

            <a href="#" class="nav-item">
                <span>📈</span>
                Reports
            </a>

            <a href="#" class="nav-item">
                <span>⚙️</span>
                Settings
            </a>

        </nav>

        <button class="logout-btn" id="logoutBtn">
            🚪 Logout
        </button>

    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-content">

        <!-- TOPBAR -->

        <header class="topbar">

            <div>

                <h1>Tasks</h1>

                <p>
                    Manage and track your team tasks
                </p>

            </div>


            <div class="profile">

                <div class="profile-info">

                    <strong id="userName">
                        Employee
                    </strong>

                    <small id="userRole">
                        EMPLOYEE
                    </small>

                </div>


                <div
                    class="avatar"
                    id="userAvatar">

                    U

                </div>

            </div>

        </header>


        <!-- =========================
             TASK MANAGEMENT CARD
        ========================== -->

        <section class="dashboard-card">

            <div class="card-header">

                <div>

                    <h2>
                        All Tasks
                    </h2>

                    <p>
                        View and manage all tasks
                    </p>

                </div>


                <button
                    class="primary-btn"
                    id="addTaskBtn"
                    type="button">

                    + Add Task

                </button>

            </div>


            <!-- SEARCH + FILTER -->

            <div class="task-controls">

                <div class="task-search">

                    <input
                        type="text"
                        id="taskSearch"
                        placeholder="🔍 Search task..."
                    >

                </div>


                <div class="task-filter">

                    <select id="taskStatusFilter">

                        <option value="ALL">
                            All Status
                        </option>

                        <option value="PENDING">
                            Pending
                        </option>

                        <option value="IN_PROGRESS">
                            In Progress
                        </option>

                        <option value="COMPLETED">
                            Completed
                        </option>

                    </select>

                </div>

            </div>


            <!-- TASK LIST -->

            <div
                class="task-list"
                id="taskList">

                <p>
                    Loading tasks...
                </p>

            </div>

        </section>

    </main>

</div>



<!-- ==================================================
     ADD TASK MODAL
================================================== -->

<div
    id="taskModal"
    class="employee-modal"
    style="display: none;">

    <div class="employee-modal-box">

        <h2>
            Add Task
        </h2>


        <form id="taskForm">

            <!-- TASK TITLE -->

            <label for="taskTitle">
                Task Title
            </label>

            <input
                type="text"
                id="taskTitle"
                placeholder="Enter task title"
                required
            >


            <!-- DESCRIPTION -->

            <label for="taskDescription">
                Description
            </label>

            <textarea
                id="taskDescription"
                placeholder="Enter task description"
                rows="4"></textarea>


            <!-- STATUS -->

            <label for="taskStatus">
                Status
            </label>

            <select
                id="taskStatus"
                required>

                <option value="PENDING">
                    Pending
                </option>

                <option value="IN_PROGRESS">
                    In Progress
                </option>

                <option value="COMPLETED">
                    Completed
                </option>

            </select>


            <!-- DUE DATE -->

            <label for="taskDueDate">
                Due Date
            </label>

            <input
                type="date"
                id="taskDueDate"
            >


            <!-- BUTTONS -->

            <div class="employee-modal-actions">

                <button
                    type="submit"
                    class="primary-btn">

                    💾 Save Task

                </button>


                <button
                    type="button"
                    id="closeTaskModal">

                    ❌ Cancel

                </button>

            </div>


            <p id="taskMessage"></p>

        </form>

    </div>

</div>



<!-- ==================================================
     EDIT TASK MODAL
================================================== -->

<div
    id="editTaskModal"
    class="employee-modal"
    style="display: none;">

    <div class="employee-modal-box">

        <h2>
            Edit Task
        </h2>


        <form id="editTaskForm">

            <!-- HIDDEN ID -->

            <input
                type="hidden"
                id="editTaskId"
            >


            <!-- TITLE -->

            <label for="editTaskTitle">
                Task Title
            </label>

            <input
                type="text"
                id="editTaskTitle"
                placeholder="Enter task title"
                required
            >


            <!-- DESCRIPTION -->

            <label for="editTaskDescription">
                Description
            </label>

            <textarea
                id="editTaskDescription"
                placeholder="Enter task description"
                rows="4"></textarea>


            <!-- STATUS -->

            <label for="editTaskStatus">
                Status
            </label>

            <select
                id="editTaskStatus"
                required>

                <option value="PENDING">
                    Pending
                </option>

                <option value="IN_PROGRESS">
                    In Progress
                </option>

                <option value="COMPLETED">
                    Completed
                </option>

            </select>


            <!-- DUE DATE -->

            <label for="editTaskDueDate">
                Due Date
            </label>

            <input
                type="date"
                id="editTaskDueDate"
            >


            <!-- BUTTONS -->

            <div class="employee-modal-actions">

                <button
                    type="submit"
                    class="primary-btn">

                    💾 Update Task

                </button>


                <button
                    type="button"
                    id="closeEditTaskModal">

                    ❌ Cancel

                </button>

            </div>


            <p id="editTaskMessage"></p>

        </form>

    </div>

</div>



<!-- JAVASCRIPT -->

<script src="script.js"></script>

</body>

</html>
